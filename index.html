<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyFlow — Учись в своём ритме</title>
<meta name="description" content="StudyFlow: задания, расписание, конспекты и фокус-таймер для школьников.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d0d0d'/%3E%3Cpath d='M8 20c4 0 4-8 8-8s4 8 8 8' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--sf:#111;--mu:#1a1a1a;--tx:#f5f5f5;--t2:#9a9a9a;--bd:#262626;--ac:#fff;--ac2:#888;--as:#222;--on:#000;--ok:var(--ac);--wn:#cfcfcf;--wb:#1f1f1f;--sh:none;--sb:#000;--g:var(--ac)}
[data-theme=white]{--bg:#fff;--sf:#fff;--mu:#f4f4f4;--tx:#0d0d0d;--t2:#6b6b6b;--bd:#e5e5e5;--ac:#0d0d0d;--as:#ececec;--on:#fff;--wn:#444;--wb:#efefef;--sb:#f9f9f9}
[data-theme=sunset]{--g:linear-gradient(135deg,#ff9a3c,#ff3d77);--ac:#ff7a59;--on:#fff;--as:#2a1819;--bgi:radial-gradient(900px 480px at 88% -8%,#ff3d7733,transparent)}
[data-theme=lime]{--g:linear-gradient(135deg,#e4f542,#2ed573);--ac:#b4e83c;--on:#0a1a05;--as:#172010;--bgi:radial-gradient(900px 480px at 88% -8%,#7bed4a2e,transparent)}
[data-theme=ocean]{--g:linear-gradient(135deg,#38bdf8,#6366f1);--ac:#5ab0ff;--on:#fff;--as:#111b2c;--bgi:radial-gradient(900px 480px at 88% -8%,#4f7bff33,transparent)}
[data-theme=violet]{--g:linear-gradient(135deg,#a855f7,#ec4899);--ac:#c88aff;--on:#fff;--as:#1f1229;--bgi:radial-gradient(900px 480px at 88% -8%,#a855f733,transparent)}
[data-theme=gold]{--g:linear-gradient(135deg,#fde047,#f59e0b);--ac:#fbbf24;--on:#1a1200;--as:#241c0a;--bgi:radial-gradient(900px 480px at 88% -8%,#facc152e,transparent)}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bg);background-image:var(--bgi,none);background-attachment:fixed;color:var(--tx);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:244px 1fr;min-height:100vh;transition:grid-template-columns .22s ease}
#app.col{grid-template-columns:68px 1fr}
#sb{position:sticky;top:0;height:100vh;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:hidden}
.lg{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.lg b{width:30px;height:30px;border-radius:9px;background:var(--g);display:grid;place-items:center;color:var(--on);flex:none}
.nv{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--t2);font-weight:500;white-space:nowrap;text-align:left;position:relative;transition:background .15s,color .15s}
.nv:hover{background:var(--mu);color:var(--tx)}
.nv.on{background:var(--as);color:var(--ac)}
.sp{flex:1}
.us{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--bd);margin-top:6px;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;background:var(--as);color:var(--ac);display:grid;place-items:center;font-weight:600;flex:none}
.col .tl,.col .lg span{display:none}
.col .us>div:not(.av){display:none}
#mn{padding:28px 36px 48px;max-width:1140px;width:100%;margin:0 auto;min-width:0}
.pg.in{animation:up .26s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:22px;letter-spacing:-.02em;line-height:1.2}
h2{font-size:15px;font-weight:600}
h3{font-size:16px}
.sub{color:var(--t2);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);font-weight:500;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--ac)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--g);border-color:transparent;color:var(--on)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--t2)}
.ib:hover{background:var(--mu);color:var(--tx)}
.ib svg{width:16px;height:16px}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:var(--sh);transition:border-color .15s}
.cd.h:hover{border-color:var(--ac)}
.gr{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:1fr 1fr}.g2d{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kp small{color:var(--t2);display:block;margin-bottom:6px}
.kp strong{font-size:22px;letter-spacing:-.02em;font-weight:600}
.kp em{display:block;font-style:normal;color:var(--t2);font-size:13px;margin-top:2px}
.sh2{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.t{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:10px;transition:background .15s,opacity .2s}
.t:hover{background:var(--mu)}
.t+.t{border-top:1px solid var(--bd)}
.cb{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--t2);display:grid;place-items:center;color:transparent;flex:none;transition:all .18s}
.cb svg{width:13px;height:13px;stroke-width:3}
.cb:hover{border-color:var(--ac)}
.dn .cb{background:var(--g);border-color:transparent;color:var(--on)}
.dn .tt{text-decoration:line-through;color:var(--t2)}
.pop .cb{animation:pp .22s ease}
@keyframes pp{50%{transform:scale(1.3)}}
.tb{flex:1;min-width:0}.tt{font-weight:500;overflow-wrap:anywhere}
.tm{display:flex;gap:10px;flex-wrap:wrap;color:var(--t2);font-size:12.5px;margin-top:2px;align-items:center}
.late{color:var(--wn);background:var(--wb);padding:0 7px;border-radius:6px}
.ac{display:flex;opacity:.55}.t:hover .ac,.t:focus-within .ac{opacity:1}
.ch{display:inline-flex;align-items:center;gap:6px}.ch i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pr{padding:0 7px;border-radius:6px;background:var(--mu)}
.p-high{color:var(--ac);background:var(--as)}
.tab{display:flex;gap:4px;flex-wrap:wrap}
.tab button{padding:6px 12px;border-radius:9px;color:var(--t2);font-weight:500}
.tab button.on{background:var(--as);color:var(--ac)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.in,select,textarea,input:not([type=checkbox]){border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:8px 11px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--as)}
.bar input,.bar select{width:auto;flex:1;min-width:140px}
.bar input[type=search]{flex:2;min-width:180px}
.emp{text-align:center;padding:36px 16px;color:var(--t2)}
.emp svg{width:28px;height:28px;margin-bottom:8px;color:var(--ac)}
.emp p{margin:4px 0 14px}
.bd3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bd3 .col3{background:var(--mu);border-radius:14px;padding:10px;min-height:120px}
.bd3 h2{padding:4px 8px 8px;display:flex;justify-content:space-between}
.bd3 .t{background:var(--sf);border:1px solid var(--bd);margin-bottom:8px}.bd3 .t+.t{border-top:1px solid var(--bd)}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring circle:first-child{stroke:var(--bd)}.ring circle:last-child{stroke:var(--ac);transition:stroke-dasharray .6s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.ls{display:flex;gap:12px;padding:9px 0}.ls+.ls{border-top:1px solid var(--bd)}
.ls i{width:4px;border-radius:2px;flex:none}.ls small{color:var(--t2)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.qa .btn{justify-content:flex-start;padding:12px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.dy{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px;min-height:180px}
.dy.td{border-color:var(--ac)}
.dy>b{display:block;font-size:12.5px;color:var(--t2);margin-bottom:8px}
.dy.td>b{color:var(--ac)}
.ln{border-radius:9px;padding:7px 9px;margin-bottom:6px;background:var(--mu);border-left:3px solid var(--ac);font-size:12.5px;overflow-wrap:anywhere}
.ln b{display:block;font-size:13px}.ln small{color:var(--t2)}
.ln.cf{outline:1px dashed var(--wn)}
.ln .ac{opacity:1;margin-top:2px}.ln .ib{width:24px;height:24px}
.tk{font-size:12px;color:var(--t2);padding:2px 4px}
.wr{background:var(--wb);color:var(--wn);padding:9px 13px;border-radius:10px;margin-bottom:14px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sj{cursor:pointer;text-align:left;display:block;width:100%}
.sj i{display:block;width:34px;height:6px;border-radius:3px;margin-bottom:12px}
.nw{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.ni{padding:11px 12px;border-radius:10px;cursor:pointer;display:block;width:100%;text-align:left;border:1px solid transparent}
.ni:hover{background:var(--mu)}.ni.on{background:var(--as);border-color:var(--ac)}
.ni b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni small{color:var(--t2)}
.tg{font-size:12px;color:var(--ac);background:var(--as);padding:0 7px;border-radius:6px;margin-right:4px}
.tbr{display:flex;gap:2px;margin:10px 0;flex-wrap:wrap;align-items:center}
.ed textarea{min-height:340px;resize:vertical;line-height:1.6}
.ttl{font-size:20px;font-weight:600;border:0!important;padding:4px 0!important;box-shadow:none!important;background:none!important}
.pv{min-height:340px;line-height:1.7}.pv h2,.pv h3,.pv h4{margin:12px 0 4px}.pv mark{background:#8885;color:inherit;padding:0 2px;border-radius:3px}.pv p{margin:6px 0}
.svi{font-size:12.5px;color:var(--t2)}
.ft{font-size:76px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1}
.pb{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin:18px 0}.pb i{display:block;height:100%;background:var(--g);transition:width .5s linear}
.fl{display:block;margin-bottom:12px}.fl span{display:block;font-size:12.5px;color:var(--t2);margin-bottom:4px}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:12px;color:var(--t2)}
.bars i{width:100%;max-width:44px;border-radius:6px 6px 2px 2px;background:var(--g);min-height:3px;transition:height .5s}
.hb{display:grid;grid-template-columns:120px 1fr 28px;gap:10px;align-items:center;margin:8px 0;font-size:13px}.hb i{display:block;height:8px;border-radius:4px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{padding:7px 14px;color:var(--t2)}.seg button[aria-pressed=true]{background:var(--as);color:var(--ac);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap}.row+.row{border-top:1px solid var(--bd)}
.row small{color:var(--t2);display:block}
.off{opacity:.6;pointer-events:none}
.ov{position:fixed;inset:0;background:#0b0d1288;display:grid;place-items:center;padding:16px;z-index:50;animation:fi .15s ease;overflow:auto}
.ov.out{opacity:0;transition:opacity .15s}
@keyframes fi{from{opacity:0}}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:22px;width:min(520px,100%);max-height:94vh;overflow:auto;animation:zm .18s ease;box-shadow:0 20px 60px #0004}
@keyframes zm{from{transform:scale(.96);opacity:0}}
.md h3{margin-bottom:14px}.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
.g2f{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{background:var(--wb);color:var(--wn);padding:8px 12px;border-radius:9px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{padding:6px 12px;border-radius:99px;border:1px solid var(--bd)}.chips button[aria-pressed=true]{background:var(--as);border-color:var(--ac);color:var(--ac)}
#ts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:90}
#ts div{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;animation:up .2s ease;box-shadow:var(--sh)}
#bn{display:none}
.lk{display:inline-flex;gap:6px;align-items:center;color:var(--t2);font-size:12.5px}
@media(max-width:900px){.g2d,.g2,.nw{grid-template-columns:1fr}.wk{grid-template-columns:1fr}.dy{min-height:0}.bd3{grid-template-columns:1fr}.nw.sel .nl{display:none}.nw:not(.sel) .ed{display:none}}
@media(max-width:820px){#app,#app.col{grid-template-columns:1fr}#sb{display:none}#mn{padding:20px 16px 96px}
#bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--sb);border-top:1px solid var(--bd);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;gap:2px}
#bn .nv{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;min-width:64px;align-items:center}#bn .nv.on:before{display:none}#bn .nv .tl{display:block!important}
.ft{font-size:56px}.g2f{grid-template-columns:1fr}}
.sw{display:flex;gap:10px;flex-wrap:wrap}.th{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;border:1px solid var(--bd);color:var(--t2);font-size:12.5px}.th i{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd)}.th[aria-pressed=true]{border-color:var(--ac);color:var(--tx)}.th:hover{border-color:var(--ac)}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><aside id="sb" aria-label="Основная навигация"></aside><main id="mn"></main><nav id="bn" aria-label="Навигация"></nav></div>
<div id="ts" role="status" aria-live="polite"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
"use strict";
/* ---------- утилиты ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pl=(n,w)=>{const a=n%100,b=n%10;return n+' '+(a>10&&a<15?w[2]:b==1?w[0]:b>1&&b<5?w[1]:w[2])};
const p2=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const td=()=>iso(new Date());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((pd(s)-pd(td()))/864e5);
const fmt=(s,o={day:'numeric',month:'short'})=>pd(s).toLocaleDateString('ru-RU',o);
const wkStart=s=>{const d=pd(s);d.setDate(d.getDate()-(d.getDay()-S.set.wk+7)%7);return iso(d)};
const P={grid:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',cal:'<path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',check:'<path d="m5 12 5 5 9-10"/>',tasks:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/>',book:'<path d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/>',spark:'<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>',bars:'<path d="M3 3v16a2 2 0 0 0 2 2h16M18 17V9M13 17V5M8 17v-3"/>',set:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',plus:'<path d="M5 12h14M12 5v14"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',pen:'<path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',play:'<path d="M6 3l14 9-14 9z"/>',pause:'<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',l:'<path d="m15 18-6-6 6-6"/>',r:'<path d="m9 18 6-6-6-6"/>',pin:'<path d="M12 17v5M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2V17h14v-1.8a2 2 0 0 0-1.1-1.8l-1.8-.9a2 2 0 0 1-1.1-1.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',ul:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',timer:'<path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/>',panel:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',arr:'<path d="M5 12h14m-6-6 6 6-6 6"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const COL=['#8a8a8a','#6f6f6f','#a5a5a5','#5c5c5c','#b8b8b8','#7d7d7d','#999999','#666666'];
const THEMES=[['black','Чёрная','#000'],['white','Белая','#fff'],['sunset','Закат','linear-gradient(135deg,#ff9a3c,#ff3d77)'],['lime','Лайм','linear-gradient(135deg,#e4f542,#2ed573)'],['ocean','Океан','linear-gradient(135deg,#38bdf8,#6366f1)'],['violet','Фиалка','linear-gradient(135deg,#a855f7,#ec4899)'],['gold','Золото','linear-gradient(135deg,#fde047,#f59e0b)']];
const DN=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];

/* ---------- состояние и хранилище ---------- */
const K='studyflow.v1';
const def=()=>({user:{name:'',grade:'',done:false},set:{theme:'black',wk:1,col:false},subjects:[],tasks:[],lessons:[],notes:[],sessions:[],focus:null});
let S;
function norm(o){const d=def();S={...d,...o,user:{...d.user,...(o&&o.user)},set:{...d.set,...(o&&o.set)}};['subjects','tasks','lessons','notes','sessions'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});S.set.theme=({light:'white',dark:'black',system:'black'})[S.set.theme]||S.set.theme}
try{norm(JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){norm({})}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Не удалось сохранить данные: хранилище браузера недоступно или переполнено')}};
const V={tf:'all',ts:'due',tv:'list',tq:'',tj:'',nq:'',nj:'',nsel:null,nprev:false,sv:'week',so:0,sd:td(),sp:30,fd:25,fb:5,fcus:'',ftask:'',fsubj:''};
const subj=id=>S.subjects.find(s=>s.id===id);
const chip=id=>{const s=subj(id);return s?`<span class="ch"><i style="background:${s.color}"></i>${esc(s.name)}</span>`:''};
const subjOpts=()=>[['','Без предмета'],...S.subjects.map(s=>[s.id,s.name])];
function toast(m){const e=document.createElement('div');e.textContent=m;$('#ts').appendChild(e);setTimeout(()=>e.remove(),3600)}

/* ---------- диалоги ---------- */
const F=(k,l,t='text',v='',o=[])=>`<label class="fl"><span>${l}</span>${t==='area'?`<textarea name="${k}" rows="3">${esc(v)}</textarea>`:t==='sel'?`<select name="${k}">${o.map(([a,b])=>`<option value="${esc(a)}"${a==v?' selected':''}>${esc(b)}</option>`).join('')}</select>`:`<input name="${k}" type="${t}" value="${esc(v)}">`}</label>`;
function modal(title,body,onOk,okText='Сохранить'){
 const m=document.createElement('div');m.className='ov';
 m.innerHTML=`<form class="md" novalidate role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${title}</h3>${body}<div class="err" hidden></div><div class="mf"><button type="button" class="btn" data-x>Отмена</button><button class="btn pri">${okText}</button></div></form>`;
 document.body.appendChild(m);
 const close=()=>{m.classList.add('out');setTimeout(()=>m.remove(),150)};
 $('[data-x]',m).onclick=close;m.onmousedown=e=>{if(e.target===m)close()};
 $('form',m).onsubmit=e=>{e.preventDefault();const r=onOk(Object.fromEntries(new FormData(e.target)));if(typeof r==='string'){const er=$('.err',m);er.hidden=false;er.textContent=r}else close()};
 const f=$('input,select,textarea',m);f&&f.focus();return close}
function ask(title,text,btns){
 const m=document.createElement('div');m.className='ov';
 m.innerHTML=`<div class="md" role="alertdialog" aria-modal="true"><h3>${title}</h3><p class="sub" style="margin:0 0 16px">${text}</p><div class="mf">${btns.map((b,i)=>`<button class="btn ${b[2]||''}" data-i="${i}">${b[0]}</button>`).join('')}</div></div>`;
 document.body.appendChild(m);const close=()=>m.remove();
 m.onclick=e=>{const b=e.target.closest('[data-i]');if(b){close();btns[b.dataset.i][1]&&btns[b.dataset.i][1]()}};
 $('.btn:last-child',m).focus()}
const confirmBox=(t,txt,fn,label='Удалить')=>ask(t,txt,[['Отмена'],[label,fn,'pri']]);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=[...document.querySelectorAll('.ov')].pop();o&&o.remove()}});

/* ---------- задания ---------- */
const PR={low:'Низкий',mid:'Обычный',high:'Высокий'};
const dueL=t=>{if(!t.due)return'Без срока';if(t.status==='done')return fmt(t.due);const n=diff(t.due);return n<0?'Просрочено на '+pl(-n,['день','дня','дней']):n===0?'Сегодня':n===1?'Завтра':'Через '+pl(n,['день','дня','дней'])};
function taskDlg(t){const n=!t;const o0=t||{prio:'mid',status:'todo',due:td()};
 modal(n?'Новое задание':'Редактировать задание',F('title','Название','text',o0.title||'')+F('desc','Описание','area',o0.desc||'')+`<div class="g2f">`+F('subj','Предмет','sel',o0.subj||'',subjOpts())+F('prio','Приоритет','sel',o0.prio,Object.entries(PR))+F('due','Срок','date',o0.due||'')+F('time','Время','time',o0.time||'')+F('status','Статус','sel',o0.status,[['todo','К выполнению'],['doing','В работе'],['done','Готово']])+F('est','Длительность, мин','number',o0.est||'')+`</div>`+F('notes','Заметки','area',o0.notes||''),
 f=>{f.title=f.title.trim();if(!f.title)return'Укажите название задания';const est=f.est?Math.round(+f.est):0;if(!(est>=0&&est<=1440))return'Длительность — от 0 до 1440 минут';
  const o={title:f.title,desc:f.desc,subj:f.subj||null,prio:f.prio,due:f.due||null,time:f.time||'',status:f.status,est,notes:f.notes};
  const x=n?{id:uid(),created:Date.now(),doneAt:null}:t;Object.assign(x,o);x.doneAt=o.status==='done'?(x.doneAt||Date.now()):null;if(n)S.tasks.push(x);save();render()})}
function tRow(t,board){const late=t.status!=='done'&&t.due&&diff(t.due)<0;
 return `<div class="t ${t.status==='done'?'dn':''}" data-tid="${t.id}"><button class="cb" data-a="toggle" data-id="${t.id}" aria-label="Выполнено: ${esc(t.title)}" aria-pressed="${t.status==='done'}">${I('check')}</button><div class="tb"><div class="tt">${esc(t.title)}</div><div class="tm">${chip(t.subj)}<span class="${late?'late':''}">${dueL(t)}${t.time?' · '+t.time:''}</span>${t.est?`<span>~${t.est} мин</span>`:''}${t.prio==='mid'?'':`<span class="pr p-${t.prio}">${PR[t.prio]}</span>`}</div></div><div class="ac">${board&&t.status!=='done'?`<button class="ib" data-a="adv" data-id="${t.id}" title="Дальше" aria-label="Перевести дальше">${I('arr')}</button>`:''}<button class="ib" data-a="push" data-id="${t.id}" title="Перенести на день" aria-label="Перенести на следующий день">${I('cal')}</button><button class="ib" data-a="editT" data-id="${t.id}" title="Изменить" aria-label="Изменить">${I('pen')}</button><button class="ib" data-a="delT" data-id="${t.id}" title="Удалить" aria-label="Удалить">${I('trash')}</button></div></div>`}
function tList(){const T=td(),w0=wkStart(T),w1=addD(w0,6),q=V.tq.toLowerCase();
 let a=S.tasks.filter(t=>(!V.tj||t.subj===V.tj)&&(!q||(t.title+' '+t.desc).toLowerCase().includes(q))&&({all:1,today:t.due===T,week:t.due&&t.due>=w0&&t.due<=w1,late:t.status!=='done'&&t.due&&t.due<T,done:t.status==='done'}[V.tf]));
 const pr={high:0,mid:1,low:2};
 a.sort(V.ts==='prio'?(x,y)=>pr[x.prio]-pr[y.prio]:V.ts==='new'?(x,y)=>y.created-x.created:(x,y)=>(x.due||'9').localeCompare(y.due||'9')||(x.time||'').localeCompare(y.time||''));
 if(!a.length)return `<div class="emp">${I('tasks')}<p>${S.tasks.length?'Ничего не найдено. Измените фильтры или поиск.':'Заданий пока нет. Добавьте первое — оно появится здесь и в обзоре.'}</p>${S.tasks.length?'':`<button class="btn pri" data-a="addT">${I('plus')}Добавить задание</button>`}</div>`;
 if(V.tv==='board')return `<div class="bd3">${[['todo','К выполнению'],['doing','В работе'],['done','Готово']].map(([k,l])=>{const c=a.filter(t=>t.status===k);return `<div class="col3"><h2>${l}<span class="sub" style="margin:0">${c.length}</span></h2>${c.map(t=>tRow(t,1)).join('')}</div>`}).join('')}</div>`;
 return `<div class="cd">${a.map(t=>tRow(t)).join('')}</div>`}
function tasksPage(){return `<div class="hd"><div><h1>Задания</h1><p class="sub">${pl(S.tasks.filter(t=>t.status!=='done').length,['активное задание','активных задания','активных заданий'])}</p></div><button class="btn pri" data-a="addT">${I('plus')}Новое задание</button></div>
<div class="bar"><input type="search" placeholder="Поиск по заданиям" aria-label="Поиск" data-in="tq" value="${esc(V.tq)}"><select data-in="tj" aria-label="Предмет">${[['','Все предметы'],...S.subjects.map(s=>[s.id,s.name])].map(([a,b])=>`<option value="${esc(a)}"${a===V.tj?' selected':''}>${esc(b)}</option>`).join('')}</select><select data-in="ts" aria-label="Сортировка">${[['due','По сроку'],['prio','По приоритету'],['new','По дате создания']].map(([a,b])=>`<option value="${a}"${a===V.ts?' selected':''}>${b}</option>`).join('')}</select><div class="seg"><button data-a="tv" data-v="list" aria-pressed="${V.tv==='list'}">Список</button><button data-a="tv" data-v="board" aria-pressed="${V.tv==='board'}">Доска</button></div></div>
<div class="tab" style="margin-bottom:14px">${[['all','Все'],['today','Сегодня'],['week','На этой неделе'],['late','Просроченные'],['done','Выполненные']].map(([k,l])=>`<button data-a="tf" data-v="${k}" class="${V.tf===k?'on':''}">${l}</button>`).join('')}</div><div id="tl">${tList()}</div>`}

/* ---------- обзор ---------- */
function nextLesson(){const n=new Date(),hm=p2(n.getHours())+':'+p2(n.getMinutes());for(let i=0;i<7;i++){const d=addD(td(),i),dow=pd(d).getDay();const L=S.lessons.filter(l=>l.day==dow&&(i>0||l.start>hm)).sort((a,b)=>a.start.localeCompare(b.start))[0];if(L)return{L,i,d}}return null}
const todayLessons=()=>S.lessons.filter(l=>l.day==new Date().getDay()).sort((a,b)=>a.start.localeCompare(b.start));
const focusMin=(from)=>S.sessions.filter(s=>s.date>=from).reduce((a,s)=>a+s.min,0);
function dash(){const T=td(),h=new Date().getHours();
 const gr=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
 const plan=S.tasks.filter(t=>t.due&&((t.status!=='done'&&t.due<=T)||(t.status==='done'&&t.due===T))).sort((a,b)=>(a.status==='done')-(b.status==='done')||(a.time||'99').localeCompare(b.time||'99'));
 const pend=plan.filter(t=>t.status!=='done').length,dn=plan.length-pend,pct=plan.length?dn/plan.length:0;
 const msg=!S.tasks.length?'Добавьте первое задание — и день станет яснее.':!plan.length?'На сегодня ничего не запланировано. Можно выдохнуть или заглянуть вперёд.':!pend?'План на сегодня выполнен. Хорошая работа.':`Осталось ${pl(pend,['задание','задания','заданий'])} на сегодня. Начните с самого важного.`;
 const nd=S.tasks.filter(t=>t.status!=='done'&&t.due&&t.due>=T).sort((a,b)=>a.due.localeCompare(b.due))[0],nl=nextLesson(),tl=todayLessons();
 const w0=pd(wkStart(T)).getTime(),wd=S.tasks.filter(t=>t.doneAt&&t.doneAt>=w0).length;
 return `<div class="hd"><div><h1>${gr}${S.user.name?', '+esc(S.user.name):''}</h1><p class="sub">${fmt(T,{weekday:'long',day:'numeric',month:'long'})}. ${msg}</p></div><button class="btn pri" data-a="addT">${I('plus')}Добавить задание</button></div>
<div class="gr g4" style="margin-bottom:16px"><div class="cd kp"><small>Запланировано сегодня</small><strong>${plan.length}</strong><em>${pend?pl(pend,['осталось','осталось','осталось']).replace(/^\d+ /,pend+' '):'всё сделано'}</em></div>
<div class="cd kp"><small>Выполнено сегодня</small><strong>${dn}</strong><em>${wd?'за неделю: '+wd:'за неделю пока 0'}</em></div>
<div class="cd kp"><small>Ближайший дедлайн</small><strong>${nd?(diff(nd.due)===0?'Сегодня':diff(nd.due)===1?'Завтра':fmt(nd.due)):'—'}</strong><em>${nd?esc(nd.title):'срочных дел нет'}</em></div>
<div class="cd kp"><small>Следующий урок</small><strong>${nl?esc((subj(nl.L.subj)||{name:'Урок'}).name):'—'}</strong><em>${nl?(nl.i?fmt(nl.d,{weekday:'short'})+', ':'')+nl.L.start:'расписание не заполнено'}</em></div></div>
<div class="gr g2d"><div class="cd"><div class="sh2"><h2>План на день</h2><button class="btn sm" data-a="go" data-v="tasks">Все задания</button></div>${plan.length?plan.map(t=>tRow(t)).join(''):`<div class="emp">${I('tasks')}<p>${S.tasks.length?'На сегодня заданий нет.':'Здесь появятся задания на сегодня и просроченные.'}</p><button class="btn" data-a="addT">${I('plus')}Добавить задание</button></div>`}</div>
<div class="gr"><div class="cd"><h2 style="margin-bottom:12px">Прогресс</h2><div style="display:flex;gap:16px;align-items:center"><div class="ring"><svg viewBox="0 0 92 92" width="92" height="92"><circle cx="46" cy="46" r="38"/><circle cx="46" cy="46" r="38" stroke-dasharray="${(pct*238.76).toFixed(1)} 238.76"/></svg><b>${Math.round(pct*100)}%</b></div><div class="sub" style="margin:0">План на сегодня: ${dn} из ${plan.length}<br>За неделю: ${wd}<br>Фокус сегодня: ${focusMin(T)} мин</div></div></div>
<div class="cd"><div class="sh2"><h2>Уроки сегодня</h2><button class="btn sm" data-a="go" data-v="sched">Расписание</button></div>${tl.length?tl.map(l=>lessonRow(l)).join(''):`<p class="sub" style="margin:0">${S.lessons.length?'Сегодня уроков нет.':'Расписание ещё не заполнено.'} <a href="#/sched" style="color:var(--ac)">${S.lessons.length?'Открыть':'Настроить'}</a></p>`}</div></div></div>
<div class="cd" style="margin-top:16px"><h2 style="margin-bottom:12px">Быстрые действия</h2><div class="qa"><button class="btn" data-a="addT">${I('tasks')}Добавить задание</button><button class="btn" data-a="newN">${I('file')}Создать конспект</button><button class="btn" data-a="addS">${I('book')}Добавить предмет</button><button class="btn" data-a="go" data-v="ai">${I('spark')}Спросить AI</button></div></div>`}
const lessonRow=l=>{const s=subj(l.subj);return `<div class="ls"><i style="background:${s?s.color:'var(--t2)'}"></i><div><b>${esc(s?s.name:'Без предмета')}</b><br><small>${l.start}–${l.end}${l.room?' · каб. '+esc(l.room):''}</small></div></div>`};

/* ---------- расписание ---------- */
const conf=(L)=>S.lessons.some(o=>o!==L&&o.day==L.day&&o.start<L.end&&L.start<o.end);
function lessonDlg(l,day){const n=!l;if(!S.subjects.length){toast('Сначала добавьте предмет');return addSubj()}
 const o=l||{day:day??new Date().getDay(),start:'08:30',end:'09:15'};const dOrd=[0,1,2,3,4,5,6].map(i=>(S.set.wk+i)%7);
 modal(n?'Новый урок':'Редактировать урок',F('subj','Предмет','sel',o.subj||S.subjects[0].id,S.subjects.map(s=>[s.id,s.name]))+F('day','День недели','sel',o.day,dOrd.map(d=>[d,DN[d]]))+`<div class="g2f">`+F('start','Начало','time',o.start)+F('end','Окончание','time',o.end)+F('room','Кабинет','text',o.room||'')+F('teacher','Преподаватель','text',o.teacher||'')+`</div>`+F('info','Дополнительно','area',o.info||''),
 f=>{if(!f.start||!f.end)return'Укажите время начала и окончания';if(f.end<=f.start)return'Урок должен заканчиваться позже, чем начинается';const x=n?{id:uid()}:l;Object.assign(x,{subj:f.subj,day:+f.day,start:f.start,end:f.end,room:f.room.trim(),teacher:f.teacher.trim(),info:f.info});if(n)S.lessons.push(x);save();render();if(conf(x))toast('Этот урок пересекается по времени с другим')})}
function schedPage(){const T=td(),day=V.sv==='day';let days;
 if(day)days=[V.sd];else{const w=addD(wkStart(T),7*V.so);days=[0,1,2,3,4,5,6].map(i=>addD(w,i))}
 const cf=S.lessons.filter(conf).length;
 return `<div class="hd"><div><h1>Расписание</h1><p class="sub">${day?fmt(V.sd,{weekday:'long',day:'numeric',month:'long'}):fmt(days[0])+' — '+fmt(days[6])}</p></div><div class="bar" style="margin:0"><div class="seg"><button data-a="sv" data-v="week" aria-pressed="${!day}">Неделя</button><button data-a="sv" data-v="day" aria-pressed="${day}">День</button></div><button class="ib" data-a="sw" data-v="-1" aria-label="Назад">${I('l')}</button><button class="btn sm" data-a="sw" data-v="0">Сегодня</button><button class="ib" data-a="sw" data-v="1" aria-label="Вперёд">${I('r')}</button><button class="btn pri" data-a="addL">${I('plus')}Урок</button></div></div>
${cf?`<div class="wr">Есть пересекающиеся уроки (${cf}). Они отмечены пунктирной рамкой.</div>`:''}
${!S.lessons.length?`<div class="cd emp">${I('cal')}<p>Расписание пустое. Уроки не добавляются автоматически — введите свои.</p><button class="btn pri" data-a="addL">${I('plus')}Добавить урок</button></div>`:`<div class="${day?'':'wk'}">${days.map(d=>{const dow=pd(d).getDay(),ls=S.lessons.filter(l=>l.day==dow).sort((a,b)=>a.start.localeCompare(b.start)),tk=S.tasks.filter(t=>t.due===d&&t.status!=='done');
 return `<div class="dy ${d===T?'td':''}"><b>${fmt(d,{weekday:'short',day:'numeric',month:'short'})}</b>${ls.map(l=>{const s=subj(l.subj);return `<div class="ln ${conf(l)?'cf':''}" style="border-color:${s?s.color:'var(--t2)'}"><b>${esc(s?s.name:'Без предмета')}</b><small>${l.start}–${l.end}${l.room?' · '+esc(l.room):''}${l.teacher?'<br>'+esc(l.teacher):''}${l.info?'<br>'+esc(l.info):''}</small><div class="ac"><button class="ib" data-a="editL" data-id="${l.id}" aria-label="Изменить урок">${I('pen')}</button><button class="ib" data-a="delL" data-id="${l.id}" aria-label="Удалить урок">${I('trash')}</button></div></div>`}).join('')}${tk.map(t=>`<div class="tk">${I('tasks')} ${esc(t.title)}</div>`).join('')}${!ls.length&&!tk.length?'<div class="tk">Свободно</div>':''}</div>`}).join('')}</div>`}`}

/* ---------- предметы ---------- */
function subjDlg(s){const n=!s;const o=s||{color:COL[S.subjects.length%COL.length]};
 modal(n?'Новый предмет':'Редактировать предмет',F('name','Название','text',o.name||'')+F('color','Цвет','color',o.color)+F('desc','Описание','area',o.desc||''),f=>{f.name=f.name.trim();if(!f.name)return'Укажите название предмета';if(S.subjects.some(x=>x!==s&&x.name.toLowerCase()===f.name.toLowerCase()))return'Предмет с таким названием уже есть';if(n)S.subjects.push({id:uid(),name:f.name,color:f.color,desc:f.desc});else Object.assign(s,{name:f.name,color:f.color,desc:f.desc});save();render()})}
const addSubj=()=>subjDlg();

function statsPage(){const T=td(),from=pd(addD(T,-V.sp+1)).getTime(),d=S.tasks.filter(t=>t.doneAt&&t.doneAt>=from);
 const wd=d.filter(t=>t.due),ontime=wd.filter(t=>iso(new Date(t.doneAt))<=t.due).length,fm=focusMin(addD(T,-V.sp+1)),ss=S.sessions.filter(s=>s.date>=addD(T,-V.sp+1)).length;
 const by={};d.forEach(t=>{by[t.subj||'']=(by[t.subj||'']||0)+1});const mx=Math.max(1,...Object.values(by));
 const w0=wkStart(T),wk=[...Array(8)].map((_,i)=>{const a=addD(w0,-7*(7-i)),s=pd(a).getTime(),e=s+7*864e5;return{a,n:S.tasks.filter(t=>t.doneAt&&t.doneAt>=s&&t.doneAt<e).length}}),wm=Math.max(1,...wk.map(x=>x.n));
 const head=`<div class="hd"><div><h1>Статистика</h1><p class="sub">Только ваши данные, без сравнения с другими</p></div><div class="seg">${[7,30,90].map(n=>`<button data-a="sp" data-v="${n}" aria-pressed="${V.sp==n}">${n} дн.</button>`).join('')}</div></div>`;
 if(!S.tasks.some(t=>t.doneAt)&&!S.sessions.length)return head+`<div class="cd emp">${I('bars')}<p>Данных пока мало. Выполните задание или завершите фокус-сессию — здесь появятся графики.</p><button class="btn pri" data-a="go" data-v="tasks">К заданиям</button></div>`;
 return head+`<div class="gr g4" style="margin-bottom:16px"><div class="cd kp"><small>Выполнено за период</small><strong>${d.length}</strong></div><div class="cd kp"><small>Выполнено в срок</small><strong>${wd.length?Math.round(ontime/wd.length*100)+'%':'—'}</strong><em>${wd.length?`${ontime} из ${wd.length} со сроком`:'нужны задания со сроком'}</em></div><div class="cd kp"><small>Время фокуса</small><strong>${fm} мин</strong></div><div class="cd kp"><small>Фокус-сессий</small><strong>${ss}</strong></div></div>
<div class="gr g2"><div class="cd"><h2 style="margin-bottom:14px">Активность по неделям</h2><div class="bars">${wk.map(x=>`<div><span>${x.n||''}</span><i style="height:${x.n/wm*78}%"></i><span>${fmt(x.a,{day:'numeric',month:'numeric'})}</span></div>`).join('')}</div></div>
<div class="cd"><h2 style="margin-bottom:8px">По предметам</h2>${Object.keys(by).length?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,n])=>{const s=subj(k);return `<div class="hb"><span class="ch"><i style="background:${s?s.color:'var(--t2)'}"></i>${esc(s?s.name:'Без предмета')}</span><span style="background:var(--bd);border-radius:4px"><i style="width:${n/mx*100}%;background:${s?s.color:'var(--t2)'}"></i></span><b>${n}</b></div>`}).join(''):'<p class="sub">За выбранный период нет выполненных заданий.</p>'}</div></div>`}

const fRem=()=>{const f=S.focus;return f.run?Math.max(0,Math.ceil((f.end-Date.now())/1000)):f.rem};
const mmss=s=>p2(Math.floor(s/60))+':'+p2(s%60);
function focusPage(){const f=S.focus;
 if(f){const r=fRem(),tot=f.phase==='focus'?f.dur*60:f.brk*60;const t=S.tasks.find(x=>x.id===f.task),s=subj(f.subj);
  return `<div class="hd"><div><h1>Фокус</h1><p class="sub">${f.phase==='focus'?'Идёт занятие':'Перерыв'}</p></div></div><div class="cd" style="max-width:560px;margin:0 auto;text-align:center"><div class="sub" style="margin:0 0 10px">${t?esc(t.title):'Без задачи'}${s?' · '+esc(s.name):''}</div><div class="ft" id="ft" aria-live="off">${mmss(r)}</div><div class="pb"><i id="fp" style="width:${(1-r/tot)*100}%"></i></div><div class="bar" style="justify-content:center;margin:0"><button class="btn pri" data-a="${f.run?'fpause':'fres'}">${I(f.run?'pause':'play')}${f.run?'Пауза':'Продолжить'}</button><button class="btn" data-a="ffin">${f.phase==='focus'?'Завершить':'Пропустить перерыв'}</button></div></div>`}
 const open=S.tasks.filter(t=>t.status!=='done'),rec=S.sessions.slice(-5).reverse();
 return `<div class="hd"><div><h1>Фокус</h1><p class="sub">Время считается только после запуска сессии</p></div></div><div class="gr g2d"><div class="cd"><h2 style="margin-bottom:10px">Длительность</h2><div class="chips">${[15,25,45].map(n=>`<button data-a="fpre" data-v="${n}" aria-pressed="${V.fd===n&&V.fcus===''}">${n} мин</button>`).join('')}<button data-a="fpre" data-v="c" aria-pressed="${V.fcus!==''}">Своя</button></div>${V.fcus!==''?F('fcus','Своя длительность, мин','number',V.fcus).replace('name="fcus"','name="fcus" data-in="fcus" min="1" max="240"'):''}${F('ftask','Задача','sel',V.ftask,[['','Без задачи'],...open.map(t=>[t.id,t.title])]).replace('name="ftask"','name="ftask" data-in="ftask"')}${F('fsubj','Предмет','sel',V.fsubj,subjOpts()).replace('name="fsubj"','name="fsubj" data-in="fsubj"')}${F('fb','Перерыв, мин','number',V.fb).replace('name="fb"','name="fb" data-in="fb" min="0" max="60"')}<button class="btn pri" data-a="fstart" style="width:100%;justify-content:center">${I('play')}Начать</button></div>
<div class="cd"><h2 style="margin-bottom:10px">Последние сессии</h2>${rec.length?rec.map(s=>`<div class="ls"><i style="background:${(subj(s.subj)||{color:'var(--t2)'}).color}"></i><div><b>${s.min} мин</b><br><small>${fmt(s.date)}${subj(s.subj)?' · '+esc(subj(s.subj).name):''}</small></div></div>`).join(''):'<p class="sub" style="margin:0">Сессий пока нет.</p>'}</div></div>`}
function fStart(){let d=V.fcus!==''?Math.round(+V.fcus):V.fd,b=Math.round(+V.fb);if(!(d>=1&&d<=240))return toast('Длительность — от 1 до 240 минут');if(!(b>=0&&b<=60))return toast('Перерыв — от 0 до 60 минут');
 S.focus={phase:'focus',dur:d,brk:b,task:V.ftask||null,subj:V.fsubj||null,rem:d*60,run:true,end:Date.now()+d*60000};save();render()}
function fSaveSess(min){const f=S.focus;S.sessions.push({id:uid(),date:td(),min,subj:f.subj,task:f.task,at:Date.now()});toast('Сессия сохранена')}
function fToBreak(){const f=S.focus;if(f.brk>0){Object.assign(f,{phase:'break',rem:f.brk*60,run:true,end:Date.now()+f.brk*60000,asking:false})}else S.focus=null;save();render()}
function fEnd(early){const f=S.focus;if(!f||f.asking)return;
 if(f.phase==='break'){S.focus=null;save();render();return}
 f.run=false;f.rem=early?fRem():0;f.asking=true;const el=early?Math.floor((f.dur*60-f.rem)/60):f.dur;
 if(early&&el<1){S.focus=null;save();render();return toast('Сессия короче минуты — не сохранена')}
 save();ask(early?'Завершить сессию?':'Сессия завершена',`Занимались ${pl(el,['минуту','минуты','минут'])}. Сохранить результат в статистику?`,[['Не сохранять',()=>{S.focus=null;save();render()}],['Сохранить',()=>{fSaveSess(el);S.focus=null;save();render()}],['Сохранить и перерыв',()=>{fSaveSess(el);fToBreak()},'pri']])}
setInterval(()=>{const f=S.focus;if(!f||!f.run)return;const r=fRem();document.title=mmss(r)+' · StudyFlow';const e=$('#ft');if(e){e.textContent=mmss(r);const tot=f.phase==='focus'?f.dur*60:f.brk*60;$('#fp').style.width=(1-r/tot)*100+'%'}
 if(r<=0){document.title='StudyFlow';if(f.phase==='focus')fEnd(false);else{S.focus=null;save();render();toast('Перерыв закончился')}}},500);

function onboard(){if($('#onb'))return;const PRE=['Математика','Русский язык','Английский язык','Биология','История','Физика','Литература','Химия','География','Информатика'];const sel=new Set();
 const m=document.createElement('div');m.className='ov';m.id='onb';
 m.innerHTML=`<form class="md" style="width:min(560px,100%)"><h3 style="font-size:20px">Добро пожаловать в StudyFlow</h3><p class="sub" style="margin:0 0 16px">Учись в своём ритме. Всё необязательно — шаги можно пропустить.</p>${F('name','Как вас зовут?','text','')}${F('grade','Класс','sel','',[['','Не указан'],...GR.map(g=>[g,g])])}<span class="sub" style="font-size:12.5px">Предметы</span><div class="chips" style="margin-top:6px">${PRE.map(p=>`<button type="button" aria-pressed="false">${p}</button>`).join('')}</div><div class="mf"><button type="button" class="btn" data-sk>Пропустить</button><button class="btn pri">Начать</button></div></form>`;
 document.body.appendChild(m);
 m.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{const k=b.textContent;sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute('aria-pressed',sel.has(k))});
 const fin=(use)=>{if(use){S.user.name=$('[name=name]',m).value.trim();S.user.grade=$('[name=grade]',m).value;[...sel].forEach((n,i)=>S.subjects.push({id:uid(),name:n,color:COL[i%COL.length],desc:''}))}S.user.done=true;save();m.remove();render()};
 $('form',m).onsubmit=e=>{e.preventDefault();fin(1)};$('[data-sk]',m).onclick=()=>fin(0);$('input',m).focus()}

/* ---------- действия ---------- */
const go=r=>location.hash='#/'+r;
const A={go,addT:()=>taskDlg(),addS:addSubj,addL:()=>lessonDlg(null,V.sv==='day'?pd(V.sd).getDay():undefined),
 editT:id=>taskDlg(S.tasks.find(t=>t.id===id)),
 delT:id=>{const t=S.tasks.find(x=>x.id===id);confirmBox('Удалить задание?',`«${esc(t.title)}» будет удалено без возможности восстановления.`,()=>{S.tasks=S.tasks.filter(x=>x!==t);save();render()})},
 toggle:(id,el)=>{const t=S.tasks.find(x=>x.id===id),row=el.closest('.t');row&&row.classList.add('pop');setTimeout(()=>{if(t.status==='done'){t.status='todo';t.doneAt=null}else{t.status='done';t.doneAt=Date.now()}save();render()},row?200:0)},
 adv:id=>{const t=S.tasks.find(x=>x.id===id);t.status=t.status==='todo'?'doing':'done';t.doneAt=t.status==='done'?Date.now():null;save();render()},
 push:id=>{const t=S.tasks.find(x=>x.id===id);t.due=addD(t.due&&t.due>td()?t.due:td(),1);save();render();toast('Срок перенесён на '+fmt(t.due))},
 tv:v=>{V.tv=v;render()},tf:v=>{V.tf=v;render()},sp:v=>{V.sp=+v;render()},
 sv:v=>{V.sv=v;V.sd=td();V.so=0;render()},sw:v=>{v=+v;if(V.sv==='day')V.sd=v?addD(V.sd,v):td();else V.so=v?V.so+v:0;render()},
 editL:id=>lessonDlg(S.lessons.find(l=>l.id===id)),delL:id=>confirmBox('Удалить урок?','Урок будет убран из расписания.',()=>{S.lessons=S.lessons.filter(l=>l.id!==id);save();render()}),
 editS:id=>subjDlg(subj(id)),delS:id=>delSubj(subj(id)),
 newN:()=>{flushN();const n={id:uid(),title:'',subj:V.nj||null,body:'',tags:[],pinned:false,created:Date.now(),updated:Date.now()};S.notes.push(n);V.nsel=n.id;V.nprev=false;save();if(location.hash!=='#/notes')go('notes');else render();setTimeout(()=>{const e=$('[data-in=nt]');e&&e.focus()},50)},
 selN:id=>{flushN();V.nsel=id;V.nprev=false;if(location.hash==='#/notes')render()},
 nback:()=>{flushN();V.nsel=null;render()},npv:()=>{flushN();V.nprev=!V.nprev;render()},
 pinN:()=>{const n=curN();n.pinned=!n.pinned;save();render()},
 delN:()=>{const n=curN();confirmBox('Удалить конспект?',`«${esc(n.title||'Без названия')}» будет удалён.`,()=>{S.notes=S.notes.filter(x=>x!==n);V.nsel=null;save();render()})},
 exp:v=>{const n=curN();const sj=subj(n.subj);const t=n.title||'Конспект';const body=v==='md'?`# ${t}\n\n${sj?'Предмет: '+sj.name+'\n':''}${n.tags.length?'Теги: '+n.tags.map(x=>'#'+x).join(' ')+'\n':''}\n${n.body}\n`:`${t}\n\n${n.body}\n`;dl(t.replace(/[\\/:*?"<>|]/g,'_')+'.'+v,body,'text/plain;charset=utf-8')},
 fm:k=>{const ta=$('#nb');if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
  if(k==='b'||k==='m'){const w=k==='b'?'**':'==';ta.value=v.slice(0,s)+w+v.slice(s,e)+w+v.slice(e);ta.setSelectionRange(s+2,e+2)}
  else{const p={h:'## ',u:'- ',c:'- [ ] '}[k],ls=s?v.lastIndexOf('\n',s-1)+1:0;ta.value=v.slice(0,ls)+p+v.slice(ls);ta.setSelectionRange(s+p.length,e+p.length)}
  ta.focus();ta.dispatchEvent(new Event('input',{bubbles:true}))},
 theme:v=>{S.set.theme=v;save();applyTheme();render()},wk:v=>{S.set.wk=+v;save();render()},
 exall:()=>dl('studyflow-backup-'+td()+'.json',JSON.stringify(S,null,1),'application/json'),
 imall:()=>$('#imp').click(),
 wipe:()=>confirmBox('Удалить все данные?','Это действие нельзя отменить. Сначала можно сделать экспорт.',()=>{localStorage.removeItem(K);norm({});save();location.hash='#/dash';render()},'Удалить всё'),
 fpre:v=>{if(v==='c')V.fcus=String(V.fd);else{V.fd=+v;V.fcus=''}render()},fstart:fStart,
 fpause:()=>{const f=S.focus;f.rem=fRem();f.run=false;save();render()},fres:()=>{const f=S.focus;f.end=Date.now()+f.rem*1000;f.run=true;save();render()},ffin:()=>fEnd(true)};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){if(el.tagName==='A'&&el.dataset.a!=='selN')e.preventDefault();A[el.dataset.a](el.dataset.id??el.dataset.v,el)}});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;const v=e.target.value;
 if(k==='tq'||k==='nq'){V[k]=v;$(k==='tq'?'#tl':'#nl').innerHTML=k==='tq'?tList():nList();return}
 if(k==='tj'||k==='ts'||k==='nj'){V[k]=v;render();return}
 if(k==='uname'){S.user.name=v.trim();save();sidebar();return}
 if(k==='ugrade'){S.user.grade=v;save();return}
 if(k==='fcus'){V.fcus=v;return}if(k==='fb'){V.fb=v;return}
 if(k==='ftask'){V.ftask=v;const t=S.tasks.find(x=>x.id===v);if(t&&t.subj)V.fsubj=t.subj;render();return}if(k==='fsubj'){V.fsubj=v;return}
 const n=curN();if(!n)return;
 if(k==='nt')n.title=v;else if(k==='nb')n.body=v;else if(k==='ns')n.subj=v||null;else if(k==='ng')n.tags=v.split(',').map(x=>x.trim().replace(/^#/,'')).filter(Boolean);
 n.updated=Date.now();$('#sv').textContent='Сохранение…';$('#nl').innerHTML=nList();clearTimeout(nTimer);nTimer=setTimeout(flushN,500)});
$('#imp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!Array.isArray(d.tasks)||!Array.isArray(d.subjects))throw 0;confirmBox('Импортировать данные?',`Файл содержит: заданий — ${d.tasks.length}, предметов — ${d.subjects.length}. Текущие данные будут заменены.`,()=>{norm(d);S.user.done=true;S.focus=null;save();render();toast('Данные импортированы')},'Импортировать')}catch(x){toast('Не удалось прочитать файл: это не резервная копия StudyFlow')}};r.readAsText(f)};
window.addEventListener('beforeunload',flushN);

/* ---------- каркас ---------- */
const NAV=[['dash','Обзор','grid'],['sched','Расписание','cal'],['tasks','Задания','tasks'],['subj','Предметы','book'],['notes','Конспекты','file'],['ai','AI-помощник','spark'],['stats','Статистика','bars'],['focus','Фокус','timer'],['set','Настройки','set']];
const route=()=>{const p=location.hash.replace(/^#\/?/,'').split('/');return{r:NAV.some(n=>n[0]===p[0])?p[0]:'dash',id:p[1]}};
function applyTheme(){let t=S.set.theme;if(!THEMES.some(x=>x[0]===t))t='black';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t==='white'?'light':'dark'}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
function sidebar(){const{r}=route(),dark=document.documentElement.dataset.theme!=='white',nm=S.user.name||'Ученик';
 $('#app').classList.toggle('col',S.set.col);
 $('#sb').innerHTML=`<div class="lg"><b>${I('spark')}</b><span>StudyFlow</span></div>${NAV.map(([k,l,ic])=>`<a class="nv ${r===k?'on':''}" href="#/${k}" ${r===k?'aria-current="page"':''} title="${l}">${I(ic)}<span class="tl">${l}</span></a>`).join('')}<span class="sp"></span><button class="nv" data-a="coll" title="Свернуть панель">${I('panel')}<span class="tl">Свернуть</span></button><button class="nv" data-a="tgl" title="Сменить тему">${I(dark?'sun':'moon')}<span class="tl">${dark?'Светлая тема':'Тёмная тема'}</span></button><div class="us"><div class="av">${esc(nm[0].toUpperCase())}</div><div><b>${esc(nm)}</b><br><small class="sub">${esc(S.user.grade||'Профиль')}</small></div></div>`;
 $('#bn').innerHTML=NAV.map(([k,l,ic])=>`<a class="nv ${r===k?'on':''}" href="#/${k}">${I(ic)}<span class="tl">${l.replace('AI-помощник','AI')}</span></a>`).join('')}
A.coll=()=>{S.set.col=!S.set.col;save();sidebar()};A.tgl=()=>{S.set.theme=document.documentElement.dataset.theme==='white'?'black':'white';save();applyTheme();render()};
let lastR=null;
function render(){flushN();applyTheme();const{r,id}=route();sidebar();
 const html={dash,tasks:tasksPage,sched:schedPage,subj:()=>subjPage(id),notes:notesPage,ai:aiPage,stats:statsPage,focus:focusPage,set:setPage}[r]();
 const mn=$('#mn'),y=scrollY;mn.innerHTML=`<div class="pg ${lastR!==r+id?'in':''}">${html}</div>`;lastR=r+id;if(lastR===r+id&&mn.firstChild&&!mn.firstChild.classList.contains('in'))scrollTo(0,y);
 document.title=(NAV.find(n=>n[0]===r)[1])+' · StudyFlow';if(!S.user.done)onboard()}
window.addEventListener('hashchange',()=>{V.sv==='day'||0;render();scrollTo(0,0)});
render();
</script>
</body>
</html>
